name: photonics_quiz
description: A pocket study companion for a transition into silicon photonics.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
flutter:
  uses-material-design: true
  assets:
    - assets/curriculum.json
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: DMSerif
      fonts:
        - asset: assets/fonts/DMSerifDisplay.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
